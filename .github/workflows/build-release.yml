name: Build and optionally make Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  #===================================================================
  # JOB 1: Build binaries for each platform in parallel
  #===================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            ext: ''
            label: linux
          - os: windows-latest
            platform: windows/amd64
            ext: .exe
            label: windows
          - os: macos-latest
            platform: darwin/universal
            ext: ''
            label: macos

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Authenticate Private Go Modules
        run: git config --global url."https://user:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ./python-backend
      
      - name: Import Code-Signing Certificates for macOS
        if: matrix.label == 'macos'
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: "${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}"
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Build Python backend
        run: |
          BACKEND_BINARY="dist/python_backend"

          if [[ "${{ matrix.label }}" == "macos" ]]; then
            echo "Building Python backend with code signing and hardened runtime entitlements..."
            pyinstaller python-backend/src/HushCut.py \
              --name python_backend \
              --onefile \
              --codesign-identity "${{ secrets.APPLE_SIGN_IDENTITY }}" \
              --osx-entitlements-file "./code-signing/entitlements.plist" \
              -y
          else
            echo "Building Python backend without code signing..."
            pyinstaller python-backend/src/HushCut.py \
              --name python_backend \
              --onefile \
              --noconsole \
              -y
          fi

          # Copy the built binary to where Wails expects it
          mkdir -p build/bin
          cp "$BACKEND_BINARY${{ matrix.ext }}" build/bin/python_backend${{ matrix.ext }}
          chmod +x build/bin/python_backend${{ matrix.ext }}

      - name: Copy Lua script
        run: cp python-backend/src/HushCut.lua build/bin/

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Make public_key files
        run: |
          mkdir -p secrets
          echo "${{ secrets.LICENSE_PUBLIC_KEY }}" > secrets/public_key.pem

      - name: Build lua helper for windows
        if: matrix.label == 'windows'
        shell: bash
        run: |
          cd lua-helper
          go build .
          mv lua-helper.exe ../build/bin/davinci_lua_helper.exe

      - name: Install NSIS
        if: matrix.label == 'windows'
        shell: powershell
        run: |
          choco install nsis -y
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Build Wails App (Windows)
        if: matrix.label == 'windows'
        uses: dAppServer/wails-build-action@6f01580fdf9e01042bcf2ebe288a934e0d6eb4e2
        with:
          build-name: HushCut${{ matrix.ext }}
          build-platform: ${{ matrix.platform }}
          package: false
          nsis: true
        
      - name: Clean Windows bin directory
        if: matrix.label == 'windows'
        shell: bash
        run: |
          rm -f build/bin/python_backend.exe
          rm -f build/bin/HushCut.exe
          rm -f build/bin/davinci_lua_helper.exe
          rm -f build/bin/HushCut.lua

      - name: Build Wails App (Unix)
        if: matrix.label != 'windows'
        uses: dAppServer/wails-build-action@6f01580fdf9e01042bcf2ebe288a934e0d6eb4e2
        with:
          build-name: HushCut${{ matrix.ext }}
          build-platform: ${{ matrix.platform }}
          package: false

      - name: Run Go tests
        run: go test ./... -v
      
      - name: Add macOS Resources folder and cleanup
        if: matrix.label == 'macos'
        run: |
          RESOURCE_DIR="build/bin/HushCut.app/Contents/Resources"
          mkdir -p "$RESOURCE_DIR"

          # Copy python backend into Resources
          cp build/bin/python_backend "$RESOURCE_DIR/"
          cp build/bin/HushCut.lua "$RESOURCE_DIR/"
          
          # Remove unnecessary package/zip from wails
          rm -f build/bin/HushCut.app.zip
          rm -f build/bin/HushCut.pkg

      - name: Install create-dmg for macOS
        if: matrix.label == 'macos'
        run: npm install --global create-dmg

      - name: Sign macOS binary, create DMG and notarize
        if: matrix.label == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          echo "Signing macOS bundle with Hardened Runtime..."
          ENTITLEMENTS="./code-signing/entitlements.plist"

          # 1. Sign nested helper binary (python_backend) inside Resources
          echo "Signing python_backend..."
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$APPLE_SIGN_IDENTITY" "build/bin/HushCut.app/Contents/Resources/python_backend"

          # 2. Sign main binary
          echo "Signing HushCut main executable..."
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$APPLE_SIGN_IDENTITY" "build/bin/HushCut.app/Contents/MacOS/HushCut"

          # 3. Sign app bundle
          echo "Signing HushCut.app bundle..."
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" --sign "$APPLE_SIGN_IDENTITY" "build/bin/HushCut.app"

          # 4. Verify app signature
          echo "Verifying HushCut.app signature..."
          codesign --verify --deep --strict --verbose=2 "build/bin/HushCut.app"

          # 5. Create DMG
          echo "Creating DMG..."
          cd build/bin
          create-dmg HushCut.app --overwrite || true
          mv HushCut*.dmg HushCut-macOS.dmg
          cd ../..

          # 6. Sign DMG
          echo "Signing DMG..."
          codesign --force --timestamp --sign "$APPLE_SIGN_IDENTITY" "build/bin/HushCut-macOS.dmg"

          # 7. Notarize with Apple notarytool
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "build/bin/HushCut-macOS.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # 8. Staple notarization ticket
          echo "Stapling notarization ticket..."
          xcrun stapler staple "build/bin/HushCut-macOS.dmg"

          # 9. Verify stapled DMG
          spctl --assess --type open --context context:primary-signature --verbose "build/bin/HushCut-macOS.dmg"

      - name: Package Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "${{ matrix.label }}" == "macos" ]]; then
            ARTIFACT_PATH="build/bin/HushCut-macOS.dmg"
          elif [[ "${{ matrix.label }}" == "windows" ]]; then
            ARTIFACT_PATH="build/bin/HushCut-amd64-installer.exe"
          else
            cd build/bin
            ARTIFACT_FILENAME="HushCut-${{ matrix.label }}.zip"
            zip -r "../../${ARTIFACT_FILENAME}" .
            ARTIFACT_PATH="${ARTIFACT_FILENAME}"
          fi
          echo "ARTIFACT_PATH=${ARTIFACT_PATH}" >> $GITHUB_ENV

      - name: Upload Release Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: HushCut-${{ matrix.label }}
          path: ${{ env.ARTIFACT_PATH }}

  #===================================================================
  # JOB 2: Publish releases
  # - Always publishes to this repo (oliwoli/HushCut)
  # - Publishes to oliwoli/hushcut-releases ONLY if not a pre-release
  #===================================================================
  publish:
    name: Publish Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded file structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/HushCut-linux/HushCut-linux.zip release-assets/HushCut-${{ github.ref_name }}-linux.zip
          cp artifacts/HushCut-windows/HushCut-amd64-installer.exe release-assets/HushCut-${{ github.ref_name }}-windows.exe
          cp artifacts/HushCut-macos/HushCut-macOS.dmg release-assets/HushCut-${{ github.ref_name }}-macos.dmg

      # Publish to THIS repo (oliwoli/HushCut)
      - name: Publish Release to HushCut
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/HushCut-${{ github.ref_name }}-linux.zip
            release-assets/HushCut-${{ github.ref_name }}-windows.exe
            release-assets/HushCut-${{ github.ref_name }}-macos.dmg

      # Publish to hushcut-releases ONLY if NOT a pre-release
      - name: Checkout public releases repo
        if: "!contains(github.ref_name, '-')"
        uses: actions/checkout@v4
        with:
          repository: oliwoli/hushcut-releases
          token: ${{ secrets.GH_PUBLISH_TOKEN }}
          path: public-repo

      - name: Organize artifacts and push to public repo
        if: "!contains(github.ref_name, '-')"
        run: |
          mkdir -p public-repo/build/macos
          mkdir -p public-repo/build/windows
          mkdir -p public-repo/build/linux

          echo "Copying package.json"
          cp package.json public-repo/package.json

          echo "Copying artifacts"
          cp artifacts/HushCut-linux/HushCut-linux.zip public-repo/build/linux/
          cp artifacts/HushCut-windows/HushCut-amd64-installer.exe public-repo/build/windows/
          cp artifacts/HushCut-macos/HushCut-macOS.dmg public-repo/build/macos/

          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/ package.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update build artifacts and package.json for tag ${{ github.ref_name }}"
            git tag ${{ github.ref_name }}
            git push && git push --tags
          fi
